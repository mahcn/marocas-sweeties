services:
  - type: web
    name: marocassweeties
    env: python
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WHATSAPP_NUMBER
        value: 5511999999999
      - key: FLASK_ENV
        value: production